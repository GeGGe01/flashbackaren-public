name = "flashbackaren-prototyp"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# Runs fully local via `wrangler dev` (miniflare emulates D1) — no Cloudflare account needed for
# local development. For a remote deploy, create a D1 database and set its id below:
#   npx wrangler d1 create flashbackaren-v1
[[d1_databases]]
binding = "DB"
database_name = "flashbackaren-v1"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Optional: mount under a path prefix (the worker strips it — see normalizeBase/mountRelativePath).
# Leave unset to serve at the host root. Example:
#   routes = [{ pattern = "example.com/flashbackaren*", zone_name = "example.com" }]
#   [vars]
#   BASE_PATH = "/flashbackaren"
