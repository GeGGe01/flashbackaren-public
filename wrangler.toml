name = "flashbackaren-prototyp"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# v1-core see-and-feel slice. Runs fully local via `wrangler dev` (miniflare emulates D1) —
# no Cloudflare account needed. The database_id below is a placeholder for local-only work;
# a real D1 id is wired at deploy time (alchemist / CF), which is deliberately deferred.
[[d1_databases]]
binding = "DB"
database_name = "flashbackaren-v1"
database_id = "local-placeholder-not-yet-provisioned"
